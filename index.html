<style>
:root{--bg:#f3f4f8;--card:#fff;--text:#14161f;--muted:#6b7080;--line:#e6e8ee;--accent:#4f46e5;--accent2:#4338ca;--soft:#f7f8fb;--good:#15803d;--goodbg:#e9f7ee;--bad:#dc2626;--hdr:#151827;--warnbg:#fff7e6;--warn:#92400e;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--text:#eceef4;--muted:#9aa0b1;--line:#2a2f3c;--accent:#8b85ff;--accent2:#7c74ff;--soft:#1d212c;--good:#22a355;--goodbg:#12301f;--bad:#e66767;--hdr:#0b0d13;--warnbg:#3a2a10;--warn:#fbbf24;color-scheme:dark}}
html.lg{--fs:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Arabic",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:860px;margin:0 auto;padding:10px 14px 130px;padding-top:max(10px,env(safe-area-inset-top))}
.hero{background:var(--hdr);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:12px;position:sticky;top:8px;z-index:20;box-shadow:0 6px 20px rgba(10,12,30,.18)}
.hero h1{font-size:1.05em;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero p{margin:0;font-size:.75em;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ttl{flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
.ib{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;min-width:42px;height:42px;font-size:18px;padding:0 10px;flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,20,40,.04),0 4px 14px rgba(16,20,40,.04)}
h3.sec{font-size:.75em;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;color:var(--muted)}
.note{font-size:.82em;color:var(--muted);margin:6px 0 0}
label{display:block;font-size:.8em;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:11px 16px;font-weight:600}
button:active{transform:scale(.98)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}button.g{background:var(--good);border-color:var(--good);color:#fff}
button.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
button.lnk{border:none;background:none;color:var(--accent);padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:none;border-radius:18px;padding:18px 16px;min-height:118px;color:#fff;box-shadow:0 6px 18px rgba(20,24,60,.14)}
.tile .ic{font-size:30px;line-height:1}.tile b{font-size:1.08em}.tile small{opacity:.85;font-weight:500;font-size:.8em}
.tile.t1{grid-column:1/-1;background:linear-gradient(135deg,#4f46e5,#2563eb);min-height:132px}.tile.t2{background:linear-gradient(135deg,#059669,#0d9488)}.tile.t3{background:linear-gradient(135deg,#d97706,#ea580c)}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{border-radius:12px;padding:10px;background:var(--soft);text-align:center}.kpi span{display:block;font-size:.68em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}.kpi b{font-size:1.4em;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:20px;padding:8px 14px;font-size:.85em}.chip.on{background:var(--hdr);color:#fff;border-color:var(--hdr)}
.search{position:relative}.search input{padding-inline-start:42px;font-size:1em}.search::before{content:"⌕";position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted)}
.letter{font-size:.75em;font-weight:800;color:var(--muted);padding:12px 4px 4px;letter-spacing:.06em}
.co{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.co.has{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.lg{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;overflow:hidden;background:#fff;border:1px solid var(--line);position:relative}
.lg img{width:78%;height:78%;object-fit:contain}.lg.fb{border:none}
.co .nm{flex:1;min-width:0}.co .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.co .nm small{color:var(--muted);font-size:.8em}
.badge{background:var(--goodbg);color:var(--good);font-weight:800;font-size:.8em;border-radius:20px;padding:4px 11px;white-space:nowrap}
.chev{color:var(--muted);font-size:20px}[dir=rtl] .chev{transform:scaleX(-1)}
.pr{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:12px}.pr:last-child{border-bottom:none}
.pr .nm{flex:1;min-width:0}.pr .nm b{display:block;font-weight:650}.pr .nm small{color:var(--muted);font-size:.82em;display:block}
.pr.has{background:var(--goodbg)}
.pp{border:1px dashed var(--line);background:none;border-radius:8px;padding:2px 8px;font-size:.78em;color:var(--muted);margin-top:4px;font-weight:600}.pp.set{border-style:solid;color:var(--text)}
.lc{font-size:.8em;color:var(--good);font-weight:700}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;flex:0 0 auto;background:var(--card)}
.step button{border:none;border-radius:0;width:46px;height:50px;padding:0;font-size:24px;font-weight:700;background:var(--soft)}
.step button.pl{background:var(--accent);color:#fff}
.step input{width:52px;border:none;border-radius:0;text-align:center;padding:8px 2px;font-weight:800;font-size:1.15em;font-variant-numeric:tabular-nums}
.pr.has .step{border-color:var(--good)}.pr.has .step input{color:var(--good)}
.x{border:none;background:none;color:var(--muted);padding:6px;font-size:.85em}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar>div{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .sum{flex:1;font-size:.85em;color:var(--muted);line-height:1.3}.bar .sum b{color:var(--text);font-size:1.25em}
.bar button{padding:13px 18px}
.grp{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft)}.gh .nm{flex:1;min-width:0}.gh b{display:block}.gh small{color:var(--muted);font-size:.8em}
.gl{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}.gl span{min-width:0}.gl small{display:block;color:var(--muted);font-size:.8em}.gl b{white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:var(--hdr);color:#fff;margin:6px 0 4px}.tot b{font-size:1.3em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--hdr);color:#fff;padding:12px 18px;border-radius:12px;font-size:.9em;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1}
.demo{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:.78em;margin-bottom:10px}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.hl:last-child{border-bottom:none}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,10,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h4{margin:4px 0 12px;font-size:1.05em}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;background:none;padding:14px 8px;border-radius:12px;font-weight:600}.mi:hover{background:var(--soft)}.mi span{font-size:22px;width:30px;text-align:center}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.langs button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* excel-like company sheet */
.xl-wrap{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(16,20,40,.05)}
.xl-top{display:flex;gap:8px;align-items:center;padding:8px;background:#217346;color:#fff}
.xl-logo{padding:0;border:none;background:none;border-radius:10px}.xl-logo .lg{border:2px solid rgba(255,255,255,.6)}
.xl-fx{flex:1;display:flex;align-items:center;background:#fff;border-radius:8px;overflow:hidden}.xl-fx span{padding:0 10px;font-style:italic;font-weight:700;color:#217346;border-inline-end:1px solid #d4d4d4}
.xl-fx input{border:none;border-radius:0;padding:9px 10px;color:#14161f;background:#fff}
.xl-grid{overflow-x:auto}
.xr{display:grid;grid-template-columns:40px minmax(150px,2.2fr) minmax(90px,1.1fr) 78px 132px;min-width:520px;border-bottom:1px solid var(--line);align-items:stretch}
.xr>div{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}.xr>div:last-child{border-inline-end:none}
.xr .r{align-items:flex-end}
.xh{background:var(--soft);position:sticky;top:0;z-index:2}.xh>div{padding:7px 8px;font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.xn{background:var(--soft);border:none;border-radius:0;border-inline-end:1px solid var(--line)!important;color:var(--muted);font-size:.78em;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center;min-height:52px}
button.xn:hover{background:color-mix(in srgb,var(--accent) 12%,var(--soft));color:var(--accent)}
.xc{border:none;border-radius:0;background:transparent;padding:10px 8px;font-size:.92em;height:100%}
.xr .r .xc{text-align:end}
.xc:focus{outline:2px solid #217346;outline-offset:-2px;background:var(--card)}
.xr.has{background:var(--goodbg)}.xr.has .xn{background:color-mix(in srgb,var(--good) 18%,var(--soft));color:var(--good)}
.xr.sel .xn{background:#217346;color:#fff}
.xr.new{animation:flash 1.4s ease}@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
.mini{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 8px;background:var(--card)}
.mini button{border:none;border-radius:0;width:36px;height:38px;padding:0;font-size:20px;font-weight:700;background:var(--soft)}.mini button.pl{background:var(--accent);color:#fff}
.mini input{width:44px;border:none;border-radius:0;text-align:center;padding:6px 0;font-weight:800;font-size:1.05em}
.xr.has .mini{border-color:var(--good)}.xr.has .mini input{color:var(--good)}
.xo{grid-template-columns:40px minmax(160px,1fr) 132px 96px;min-width:420px}
.xo>div:not(.xn){padding:8px}.xo>div.r{padding:0 8px}.xo small{display:block;color:var(--muted);font-size:.8em}
.xt{background:var(--hdr);color:#fff}.xt .xn{background:var(--hdr);color:#fff}.xt>div{border-color:rgba(255,255,255,.12)!important}
.xadd>div{padding:6px 8px}
.xl-tabs{display:flex;gap:2px;background:var(--soft);border-top:1.5px solid var(--line);padding:0 6px}
.xl-tabs button{border:none;border-radius:0 0 10px 10px;background:transparent;padding:11px 14px;font-weight:700;color:var(--muted);border-top:3px solid transparent;margin-top:-1.5px}
.xl-tabs button.on{background:var(--card);color:#217346;border-top-color:#217346;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.xl-tabs i{font-style:normal;background:var(--line);color:var(--text);border-radius:10px;padding:1px 7px;font-size:.78em;margin-inline-start:4px}.xl-tabs i.dot{background:var(--good);color:#fff}
.xr{grid-template-columns:34px minmax(0,1fr) 74px 124px;min-width:0}
.xc-name{font-weight:650;padding:10px 8px}.xc-size{font-size:.8em;color:var(--muted);padding:2px 8px 8px}
.xr .xc-price{padding:10px 6px}
.xo{grid-template-columns:34px minmax(0,1fr) 124px 84px;min-width:0}
.mini{margin:6px}.mini button{width:34px}.mini input{width:40px}
.xl-tabs{border-top:none;border-bottom:1.5px solid var(--line);padding:6px 6px 0;background:#e8efe9}
.xl-tabs button{border-radius:10px 10px 0 0;border-top:none;border-bottom:3px solid transparent;margin:0}
.xl-tabs button.on{border-bottom-color:#217346;border-top:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xl-tabs{background:#16241b}}
.xr{grid-template-columns:40px minmax(0,1fr) 104px 124px}
.xo{grid-template-columns:34px minmax(0,1fr) 104px 124px}
.us{border:none;border-radius:0;background:transparent;padding:10px 6px;font-weight:600;font-size:.88em;height:100%;color:var(--text)}
.us:focus{outline:2px solid #217346;outline-offset:-2px}
.xn{touch-action:none;cursor:grab;flex-direction:column;gap:0;line-height:1}.xn .hd{font-size:13px;opacity:.55;letter-spacing:-1px}
.xr.dragging{position:relative;z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.22);background:var(--card);opacity:.96}
.xr.dropB{box-shadow:inset 0 3px 0 #217346}.xr.dropA{box-shadow:inset 0 -3px 0 #217346}
body.noselect{user-select:none;-webkit-user-select:none}
.ut{font-weight:600;font-size:.85em;color:var(--muted)}
.dup{font-size:.75em;color:var(--muted);padding:0 8px 8px;margin-top:-6px}

const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length]};
const initials=s=>s.replace(/^The /,'').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
function logoHTML(c,size){const sz=size?`width:${size}px;height:${size}px;`:'';const src=c.logo||(c.domain?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(c.domain)}&sz=128`:'');

let auth,fs,UID=null;
const store={
 async get(p){if(DEMO){const v=localStorage.getItem('dali:'+p);return v?JSON.parse(v):null}const d=await fs.doc('stores/'+UID+'/'+p).get();return d.exists?d.data():null},
 async set(p,v){if(DEMO){localStorage.setItem('dali:'+p,JSON.stringify(v));return}await fs.doc('stores/'+UID+'/'+p).set(v)},
 async del(p){if(DEMO){localStorage.removeItem('dali:'+p);return}await fs.doc('stores/'+UID+'/'+p).delete()},
 async list(col){if(DEMO){const pre='dali:'+col+'/';return Object.keys(localStorage).filter(k=>k.startsWith(pre)).map(k=>({id:k.slice(pre.length),...JSON.parse(localStorage.getItem(k))}))}
  const s=await fs.collection('stores/'+UID+'/'+col).get();return s.docs.map(d=>({id:d.id,...d.data()}))},
 async batchSet(items){if(DEMO){items.forEach(([p,v])=>localStorage.setItem('dali:'+p,JSON.stringify(v)));return}
  for(let i=0;i<items.length;i+=400){const b=fs.batch();items.slice(i,i+400).forEach(([p,v])=>b.set(fs.doc('stores/'+UID+'/'+p),v));await b.commit()}}

/* ---------- order data ---------- */
const UNITS=['Box','Case','Pack','Can','Bottle','Bag','Carton','Piece'];
const uT=u=>((I18N.U[LANG]||I18N.U.en)[UNITS.indexOf(u)]||u);
const unitOf=(p,l)=>(l&&l.unit)||p.unit||'Box';
function unitSum(rows,en){const m={};rows.forEach(r=>{m[r.unit]=(m[r.unit]||0)+r.qty});return UNITS.filter(u=>m[u]).concat(Object.keys(m).filter(u=>!UNITS.includes(u))).map(u=>m[u]+' '+(en?u:uT(u))).join(' · ')||'0'}
const dupName=(c,p)=>p.size&&c.products.some(x=>x!==p&&(x.name||'').trim().toLowerCase()===(p.name||'').trim().toLowerCase());
const dispName=(c,p)=>p.name+(dupName(c,p)?' ('+p.size+')':'');
function orderRows(){return lines().map(([pid,l])=>{const[c,p]=findProd(pid);return c&&p?{company:c.name,cid:c.id,product:dispName(c,p),pname:p.name,size:p.size||'',qty:l.qty,unit:unitOf(p,l)}:null}).filter(Boolean)
 .sort((a,b)=>a.company.localeCompare(b.company)||a.product.localeCompare(b.product))}
const sumBoxes=r=>r.reduce((a,x)=>a+x.qty,0);
function groups(rows){const g=[];for(const r of rows){let x=g.find(y=>y.company===r.company);if(!x){x={company:r.company,cid:r.cid,rows:[]};g.push(x)}x.rows.push(r)}return g}
function orderView(rows){
 return groups(rows).map(g=>{const c=coById(g.cid)||COS.find(x=>x.name===g.company)||{name:g.company};
  return `<div class="grp"><div class="gh">${logoHTML(c,36)}<div class="nm"><b>${esc(g.company)}</b><small>${esc(unitSum(g.rows))}</small></div><button data-send="${esc(g.company)}">📤 ${t('share')}</button></div>
  ${g.rows.map(r=>`<div class="gl"><span>${esc(r.product)}</span><b>${r.qty} <span class="ut">${esc(uT(r.unit))}</span></b></div>`).join('')}</div>`}).join('')+
 `<div class="tot"><span>${t('total')}<br><small style="opacity:.75">${rows.length} ${t('products').toLowerCase()}</small></span><span style="text-align:end"><b>${esc(unitSum(rows))}</b></span></div>`}
function exportBox(){return `<label>⬇ ${t('onlyQty')}</label><div class="acts" style="margin-top:0"><button class="p" data-x="xlsx">📊 ${t('excel')}</button><button class="p" data-x="pdf">📄 ${t('pdf')}</button><button data-x="csv">${t('csv')}</button><button data-x="txt">📋 ${t('copyTxt')}</button><button data-x="share">📤 ${t('share')}</button></div>`}
function orderText(rows,date){let s=`Dali Market · ${date||today()}\n`,last='';for(const r of rows){if(r.company!==last){last=r.company;s+=`\n*${r.company}*\n`}s+=`• ${r.product}: ${r.qty} ${r.unit}\n`}
 return s+`\nTotal: ${unitSum(rows,true)}`}
async function shareText(txt){if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e.name==='AbortError')return}}window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast(t('downloaded')+' · '+name)}
function doExport(kind,rows,date,coName){
 const d=date||today(),name='Dali-order-'+(coName?coName.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-':'')+d;if(!rows.length){toast(t('nothingExp'));return}
 rows=rows.map(r=>({...r,unit:r.unit||'Box'}));
 if(kind==='txt'){navigator.clipboard.writeText(orderText(rows,d)).then(()=>toast(t('copied')),()=>toast('Copy not allowed'));return}
 if(kind==='share'){shareText(orderText(rows,d));return}
 const head=['Company','Product','Unit','Qty'],body=rows.map(r=>[r.company,r.product,r.unit,r.qty]);
 if(kind==='csv'){const qq=v=>'"'+String(v).replace(/"/g,'""')+'"';download(new Blob(['﻿'+[['Date',...head],...body.map(b=>[d,...b])].map(r=>r.map(qq).join(',')).join('\n')],{type:'text/csv'}),name+'.csv');return}
 if(kind==='xlsx'){if(!window.XLSX){toast(t('libFail'));return}const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([['Dali Market order',d],[],head,...body,[],['','','Total',unitSum(rows,true)]]);ws['!cols']=[{wch:28},{wch:40},{wch:10},{wch:8}];XLSX.utils.book_append_sheet(wb,ws,'Order');
  for(const g of groups(rows)){const w=XLSX.utils.aoa_to_sheet([[g.company,d],[],head.slice(1),...g.rows.map(r=>[r.product,r.unit,r.qty]),[],['','Total',unitSum(g.rows,true)]]);w['!cols']=[{wch:40},{wch:10},{wch:8}];
   XLSX.utils.book_append_sheet(wb,w,g.company.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31))}
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx');return}
 if(kind==='pdf'){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast(t('libFail'));return}
  const doc=new J({unit:'pt',format:'letter'}),W=doc.internal.pageSize.getWidth();
  doc.setFillColor(21,24,39);doc.rect(0,0,W,70,'F');doc.setTextColor(255);doc.setFontSize(18);doc.setFont('helvetica','bold');doc.text('Dali Market - Purchase order',40,42);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text(d+'   |   '+rows.length+' products   |   '+unitSum(rows,true),40,60);
  let y=92;doc.setTextColor(20);
  for(const g of groups(rows)){
   doc.autoTable({startY:y,head:[[{content:g.company+'   ('+unitSum(g.rows,true)+')',colSpan:3,styles:{halign:'left',fillColor:[33,115,70],fontSize:11}}],['Product','Unit','Qty']],
    body:g.rows.map(r=>[r.product,r.unit,r.qty]),
    styles:{fontSize:10,cellPadding:5},headStyles:{fillColor:[238,240,246],textColor:20},columnStyles:{2:{halign:'right',fontStyle:'bold'}},alternateRowStyles:{fillColor:[250,250,252]},margin:{left:40,right:40}});
   y=doc.lastAutoTable.finalY+16}
  if(y>doc.internal.pageSize.getHeight()-60){doc.addPage();y=60}
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Total: '+unitSum(rows,true),40,y+6);
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(140);doc.text('Page '+i+' / '+n,W-40,doc.internal.pageSize.getHeight()-20,{align:'right'})}
  download(new Blob([doc.output('arraybuffer')],{type:'application/pdf'}),name+'.pdf')}
}
